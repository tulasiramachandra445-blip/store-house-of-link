<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Store House of Link — Organize Your Favorite Websites by Topic</title>
<meta name="description" content="Store House of Link is a personal bookmark manager and website directory. Save your favorite websites once, organize them into topics like AI Tools, Programming, Design and Education, and find them instantly without searching the internet again.">
<meta name="keywords" content="bookmark manager, link organizer, website directory, save links, favorite websites, topic organizer">
<meta property="og:title" content="Store House of Link">
<meta property="og:description" content="Save useful websites once, organize them by topic, and access them instantly whenever you need them.">
<meta property="og:type" content="website">
<meta name="robots" content="index, follow">
<!-- Once hosted on your own domain, add: <link rel="canonical" href="https://yourdomain.com/"> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFF3F0; --surface:#FFFFFF; --ink:#1B2A2E; --ink-soft:#5B6B67;
  --teal:#1F6F63; --teal-deep:#154E45; --gold:#C9971F; --line:#DDE4E0;
  --danger:#B4432E; --shadow: 0 1px 2px rgba(27,42,46,.06);
  --radius:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14181A; --surface:#1D2325; --ink:#EAEFEC; --ink-soft:#9AAAA5;
    --teal:#3FA895; --teal-deep:#2C7A6C; --gold:#E0B24A; --line:#2C3436;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#14181A; --surface:#1D2325; --ink:#EAEFEC; --ink-soft:#9AAAA5;
  --teal:#3FA895; --teal-deep:#2C7A6C; --gold:#E0B24A; --line:#2C3436;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.brand{font-family:'Fraunces',serif}
a{color:inherit}
button{font-family:inherit; cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

.app{display:grid; grid-template-columns:230px 1fr; min-height:100vh}
@media (max-width:820px){ .app{grid-template-columns:1fr} }

/* Sidebar */
.sidebar{
  background:var(--surface); border-right:1px solid var(--line);
  padding:22px 16px; display:flex; flex-direction:column; gap:22px;
  position:sticky; top:0; height:100vh; padding-top:calc(22px + env(safe-area-inset-top,0px));
}
@media (max-width:820px){ .sidebar{display:none} }
.brand{font-size:17px; font-weight:600; letter-spacing:.1px; display:flex; align-items:center; gap:8px; line-height:1.25}
.brand .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--teal),var(--gold));display:inline-block}
.nav{display:flex; flex-direction:column; gap:3px}
.nav button{
  background:none; border:none; text-align:left; padding:10px 12px; border-radius:9px;
  color:var(--ink-soft); font-size:14.5px; font-weight:500; display:flex; gap:10px; align-items:center;
}
.nav button:hover{background:var(--paper)}
.nav button.active{background:var(--teal); color:#fff}
.nav-icon{width:18px;text-align:center}

/* Mobile top bar */
.topbar{display:none}
@media (max-width:820px){
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px; background:var(--surface); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:5; padding-top:calc(14px + env(safe-area-inset-top,0px));
  }
}
.mobile-nav{display:none}
@media (max-width:820px){
  .mobile-nav{
    display:flex; justify-content:space-around; position:sticky; bottom:0; background:var(--surface);
    border-top:1px solid var(--line); padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px)); z-index:5;
  }
  .mobile-nav button{background:none;border:none;font-size:11px;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:3px}
  .mobile-nav button.active{color:var(--teal)}
}

main{padding:26px 30px 60px; max-width:1180px; width:100%; margin:0 auto}
@media (max-width:820px){ main{padding:16px 16px 90px} }

.headline{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:20px; flex-wrap:wrap}
.headline h1{font-size:26px; margin:0 0 4px; font-weight:600}
.headline p{margin:0; color:var(--ink-soft); font-size:14px}

.searchbar{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:10px 14px; margin-bottom:24px}
.searchbar input{border:none; outline:none; background:none; color:var(--ink); font-size:15px; width:100%; font-family:inherit}
.searchbar svg{flex-shrink:0; opacity:.55}

.section-title{display:flex; justify-content:space-between; align-items:center; margin:28px 0 12px}
.section-title h2{font-size:16px; font-weight:600; margin:0; color:var(--ink-soft); text-transform:none}
.pill-btn{background:var(--teal); color:#fff; border:none; padding:9px 15px; border-radius:9px; font-size:13.5px; font-weight:600; display:inline-flex; gap:6px; align-items:center}
.ghost-btn{background:none; border:1px solid var(--line); color:var(--ink); padding:8px 13px; border-radius:9px; font-size:13px}

.cat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
.cat-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; cursor:pointer; transition:border-color .15s, transform .1s;
}
.cat-card:hover{border-color:var(--teal)}
.cat-card .icon{font-size:22px}
.cat-card .name{font-weight:600; font-size:14.5px; margin-top:8px}
.cat-card .count{color:var(--ink-soft); font-size:12.5px; margin-top:2px}

.card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px}
.site-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow);
}
.site-top{display:flex; gap:10px; align-items:center}
.favicon{width:30px;height:30px;border-radius:8px; flex-shrink:0; background:var(--paper); display:flex; align-items:center; justify-content:center; font-size:14px; overflow:hidden}
.favicon img{width:100%;height:100%;object-fit:contain}
.site-name{font-weight:600; font-size:15px}
.site-cat{color:var(--teal); font-size:11.5px; font-weight:600}
.site-desc{color:var(--ink-soft); font-size:13px; line-height:1.4; margin:0}
.tags{display:flex; flex-wrap:wrap; gap:6px}
.tag{background:var(--paper); border-radius:6px; padding:3px 8px; font-size:11px; color:var(--ink-soft)}
.site-actions{display:flex; gap:6px; margin-top:6px; align-items:center}
.icon-btn{background:none; border:1px solid var(--line); border-radius:8px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:14px}
.icon-btn.fav.active{color:var(--gold); border-color:var(--gold)}
.icon-btn:hover{border-color:var(--teal); color:var(--teal)}
.open-btn{flex:1; background:var(--teal-deep); color:#fff; border:none; border-radius:8px; padding:0 12px; height:32px; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center; text-decoration:none}

.empty{color:var(--ink-soft); font-size:14px; padding:26px; text-align:center; border:1px dashed var(--line); border-radius:12px}

/* Modal */
.overlay{position:fixed; inset:0; background:rgba(20,24,26,.5); display:none; align-items:center; justify-content:center; z-index:50; padding:16px}
.overlay.show{display:flex}
.modal{background:var(--surface); border-radius:16px; padding:24px; width:100%; max-width:440px; max-height:88vh; overflow-y:auto}
.modal h2{margin:0 0 16px; font-size:19px}
.field{margin-bottom:13px}
.field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:600}
.field input, .field select, .field textarea{
  width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--line); background:var(--paper);
  color:var(--ink); font-size:14px; font-family:inherit; outline:none;
}
.field textarea{resize:vertical; min-height:56px}
.field-row{display:flex; gap:10px}
.field-row .field{flex:1}
.check-row{display:flex; align-items:center; gap:8px; font-size:13.5px; margin-bottom:14px}
.modal-actions{display:flex; gap:10px; margin-top:6px}
.modal-actions button{flex:1; padding:10px; border-radius:9px; font-weight:600; font-size:14px; border:1px solid var(--line); background:none; color:var(--ink)}
.modal-actions .primary{background:var(--teal); color:#fff; border:none}

.top-actions{display:flex; gap:10px; align-items:center}
.theme-toggle{background:none; border:1px solid var(--line); border-radius:9px; width:36px; height:36px; display:flex; align-items:center; justify-content:center}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="mark"></span>Store House of Link</div>
    <nav class="nav" id="desktopNav"></nav>
    <button id="ownerBtn" onclick="ownerToggle()" style="margin-top:auto; background:none; border:1px solid var(--line); border-radius:9px; padding:9px 11px; font-size:12.5px; color:var(--ink-soft); text-align:left; display:flex; align-items:center; gap:8px"></button>
  </aside>

  <div>
    <div class="topbar">
      <div class="brand" style="font-size:15.5px"><span class="mark" style="width:20px;height:20px"></span>Store House of Link</div>
      <div class="top-actions">
        <button class="theme-toggle" id="themeToggleMobile">◐</button>
      </div>
    </div>

    <main id="main"></main>

    <nav class="mobile-nav" id="mobileNav"></nav>
  </div>
</div>

<div class="overlay" id="addOverlay">
  <div class="modal">
    <h2 id="modalTitle">Add a website</h2>
    <form id="siteForm">
      <div class="field"><label>Website name</label><input required id="f_name" placeholder="e.g. Notion"></div>
      <div class="field"><label>URL</label><input required id="f_url" type="url" placeholder="https://example.com"></div>
      <div class="field"><label>Description</label><textarea id="f_desc" placeholder="What is it for?"></textarea></div>
      <div class="field-row">
        <div class="field">
          <label>Category</label>
          <select id="f_cat"></select>
        </div>
        <div class="field"><label>Subcategory (optional)</label><input id="f_sub" placeholder="e.g. Chatbots"></div>
      </div>
      <div class="field"><label>Tags (comma separated)</label><input id="f_tags" placeholder="ai, writing, free"></div>
      <div class="check-row"><input type="checkbox" id="f_fav"><label for="f_fav">Mark as favorite</label></div>
      <div class="modal-actions">
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="submit" class="primary" id="saveBtn">Save website</button>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="catOverlay">
  <div class="modal">
    <h2>New category</h2>
    <div class="field"><label>Category name</label><input id="nc_name" placeholder="e.g. Finance"></div>
    <div class="field"><label>Icon (single emoji)</label><input id="nc_icon" placeholder="💰" maxlength="2"></div>
    <div class="modal-actions">
      <button type="button" id="catCancel">Cancel</button>
      <button type="button" class="primary" id="catSave">Create</button>
    </div>
  </div>
</div>

function loadData(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const now=Date.now();
  const sites=SAMPLE_SITES.map((s,i)=>({
    id:'s'+i, name:s.name, url:s.url, desc:s.desc, cat:s.cat, sub:s.sub||'',
    tags:s.tags||[], fav:!!s.fav, addedAt: now-i*3600000, lastOpened:null, visits:0
  }));
  return { cats: DEFAULT_CATS.slice(), sites };
}
let data = loadData();
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){} }

let theme = localStorage.getItem('linkhub_theme') || null;
if(theme) document.documentElement.setAttribute('data-theme', theme);
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light');
  const next = cur==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('linkhub_theme', next);
}
document.getElementById('themeToggleMobile').onclick = toggleTheme;

let view = {page:'dashboard', catId:null, query:''};
let editingId = null;
const OWNER_PIN_KEY = 'linkhub_owner_pin';
let ownerUnlocked = false;

function updateOwnerBtn(){
  const b = document.getElementById('ownerBtn');
  if(!b) return;
  b.innerHTML = ownerUnlocked
    ? '🔓 Owner mode — on <span style="margin-left:auto;color:var(--teal)">tap to lock</span>'
    : '🔒 Owner mode — off';
  b.style.justifyContent = ownerUnlocked ? 'flex-start' : 'flex-start';
}
function ownerToggle(){
  if(ownerUnlocked){
    ownerUnlocked = false;
    render();
    return;
  }
  let pin = localStorage.getItem(OWNER_PIN_KEY);
  if(!pin){
    const setPin = prompt('No owner PIN is set yet. Create one now — this PIN will control who can add or edit domains/categories:');
    if(!setPin) return;
    localStorage.setItem(OWNER_PIN_KEY, setPin);
    ownerUnlocked = true;
    render();
    return;
  }
  const entered = prompt('Enter the owner PIN to manage domains/categories:');
  if(entered === null) return;
  if(entered === pin){ ownerUnlocked = true; render(); }
  else alert('Incorrect PIN.');
}

const NAV_ITEMS = [
  {id:'dashboard', label:'Dashboard', icon:'⌂'},
  {id:'categories', label:'Categories', icon:'▤'},
  {id:'favorites', label:'Favorites', icon:'★'},
  {id:'recent', label:'Recently Used', icon:'⟲'},
  {id:'add', label:'Add Website', icon:'+'},
];

function renderNav(){
  const desktop = document.getElementById('desktopNav');
  const mobile = document.getElementById('mobileNav');
  desktop.innerHTML=''; mobile.innerHTML='';
  NAV_ITEMS.forEach(item=>{
    const b1=document.createElement('button');
    b1.className='nav-icon-wrap'+(view.page===item.id?' active':'');
    b1.innerHTML=`<span class="nav-icon">${item.icon}</span> ${item.label}`;
    b1.onclick=()=>{ if(item.id==='add'){ openSiteModal(); } else { view.page=item.id; view.catId=null; render(); } };
    desktop.appendChild(b1);

    const b2=document.createElement('button');
    b2.className=view.page===item.id?'active':'';
    b2.innerHTML=`<span>${item.icon}</span><span>${item.label.split(' ')[0]}</span>`;
    b2.onclick=()=>{ if(item.id==='add'){ openSiteModal(); } else { view.page=item.id; view.catId=null; render(); } };
    mobile.appendChild(b2);
  });
  desktop.querySelectorAll('button').forEach((b,i)=>{ if(NAV_ITEMS[i].id===view.page) b.classList.add('active'); });
}

function catName(id){ const c=data.cats.find(c=>c.id===id); return c? c.name : id; }
function catIcon(id){ const c=data.cats.find(c=>c.id===id); return c? c.icon : '🔗'; }

function siteCard(s){
  const fav = favicon(s.url);
  return `<div class="site-card">
    <div class="site-top">
      <div class="favicon">${fav?`<img src="${fav}" onerror="this.parentElement.textContent='🔗'">`:'🔗'}</div>
      <div>
        <div class="site-name">${escapeHtml(s.name)}</div>
        <div class="site-cat">${escapeHtml(catName(s.cat))}${s.sub?' · '+escapeHtml(s.sub):''}</div>
      </div>
    </div>
    <p class="site-desc">${escapeHtml(s.desc||'')}</p>
    <div class="tags">${(s.tags||[]).map(t=>`<span class="tag">#${escapeHtml(t)}</span>`).join('')}</div>
    <div class="site-actions">
      <button class="icon-btn fav ${s.fav?'active':''}" title="Favorite" onclick="toggleFav('${s.id}')">★</button>
      <a class="open-btn" href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer" onclick="trackVisit('${s.id}')">Open ↗</a>
      <button class="icon-btn" title="Edit" onclick="openSiteModal('${s.id}')">✎</button>
      <button class="icon-btn" title="Delete" onclick="deleteSite('${s.id}')">🗑</button>
    </div>
  </div>`;
}
function escapeHtml(str){ return (str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function trackVisit(id){
  const s=data.sites.find(x=>x.id===id); if(!s) return;
  s.lastOpened=Date.now(); s.visits=(s.visits||0)+1; save();
  // don't re-render immediately: that would destroy the anchor mid-click in some browsers
  setTimeout(render, 150);
}
function toggleFav(id){ const s=data.sites.find(x=>x.id===id); s.fav=!s.fav; save(); render(); }
function deleteSite(id){ data.sites = data.sites.filter(x=>x.id!==id); save(); render(); }

function matchesQuery(s,q){
  if(!q) return true;
  q=q.toLowerCase();
  return [s.name,s.desc,catName(s.cat),s.sub,...(s.tags||[])].join(' ').toLowerCase().includes(q);
}

function render(){
  renderNav();
  updateOwnerBtn();
  const main = document.getElementById('main');
  const q = view.query;
  let html='';

  if(view.page==='dashboard'){
    html += headline('Dashboard','Everything you\'ve saved, organized by topic.');
    html += searchBar();
    const filtered = q ? data.sites.filter(s=>matchesQuery(s,q)) : null;
    if(filtered){
      html += sectionTitle('Search results');
      html += filtered.length ? `<div class="card-grid">${filtered.map(siteCard).join('')}</div>` : emptyMsg('No websites match your search.');
    } else {
      html += sectionTitle('Categories');
      html += `<div class="cat-grid">${data.cats.map(c=>{
        const count = data.sites.filter(s=>s.cat===c.id).length;
        return `<div class="cat-card" onclick="goCategory('${c.id}')"><div class="icon">${c.icon}</div><div class="name">${escapeHtml(c.name)}</div><div class="count">${count} site${count!==1?'s':''}</div></div>`;
      }).join('')}</div>`;

      const favs = data.sites.filter(s=>s.fav).slice(0,4);
      html += sectionTitle('Favorites');
      html += favs.length ? `<div class="card-grid">${favs.map(siteCard).join('')}</div>` : emptyMsg('Mark a website as favorite to see it here.');

      const recent = [...data.sites].sort((a,b)=>b.addedAt-a.addedAt).slice(0,4);
      html += sectionTitle('Recently added');
      html += recent.length ? `<div class="card-grid">${recent.map(siteCard).join('')}</div>` : emptyMsg('No websites yet.');

      const mostVisited = [...data.sites].filter(s=>s.visits>0).sort((a,b)=>b.visits-a.visits).slice(0,4);
      html += sectionTitle('Most visited');
      html += mostVisited.length ? `<div class="card-grid">${mostVisited.map(siteCard).join('')}</div>` : emptyMsg('Open a few websites to see your most visited here.');
    }
  }

  else if(view.page==='categories'){
    if(view.catId){
      const c = data.cats.find(x=>x.id===view.catId);
      html += headline(c.icon+' '+c.name, '');
      html += `<div class="section-title"><button class="ghost-btn" onclick="view.catId=null;render()">← All categories</button></div>`;
      const sites = data.sites.filter(s=>s.cat===view.catId && matchesQuery(s,q));
      html += searchBar();
      html += sites.length ? `<div class="card-grid">${sites.map(siteCard).join('')}</div>` : emptyMsg('No websites in this category yet.');
    } else {
      html += headline('Categories','Browse or create topic collections.');
      html += `<div class="section-title"><span></span>${ownerUnlocked
        ? `<button class="pill-btn" onclick="openCatModal()">+ New category</button>`
        : `<button class="ghost-btn" onclick="ownerToggle()">🔒 Unlock owner mode to add domains</button>`}</div>`;
      html += `<div class="cat-grid">${data.cats.map(c=>{
        const count = data.sites.filter(s=>s.cat===c.id).length;
        return `<div class="cat-card" onclick="goCategory('${c.id}')"><div class="icon">${c.icon}</div><div class="name">${escapeHtml(c.name)}</div><div class="count">${count} site${count!==1?'s':''}</div></div>`;
      }).join('')}</div>`;
    }
  }

  else if(view.page==='favorites'){
    html += headline('Favorites','Your most-relied-on websites.');
    html += searchBar();
    const favs = data.sites.filter(s=>s.fav && matchesQuery(s,q));
    html += favs.length ? `<div class="card-grid">${favs.map(siteCard).join('')}</div>` : emptyMsg('No favorites yet — tap the star on any website to add it here.');
  }

  else if(view.page==='recent'){
    html += headline('Recently Used','Websites you\'ve opened recently.');
    html += searchBar();
    const recent = data.sites.filter(s=>s.lastOpened && matchesQuery(s,q)).sort((a,b)=>b.lastOpened-a.lastOpened);
    html += recent.length ? `<div class="card-grid">${recent.map(siteCard).join('')}</div>` : emptyMsg('Open a website and it will show up here.');
  }

  main.innerHTML = html;
  const input = main.querySelector('#searchInput');
  if(input){ input.value=q; input.oninput=(e)=>{ view.query=e.target.value; render(); input.focus(); const val=input.value; input.value=''; input.value=val; }; }
}
function headline(title,sub){ return `<div class="headline"><div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div><button class="theme-toggle" style="display:none" id="d"></button></div>`; }
function sectionTitle(t){ return `<div class="section-title"><h2>${t}</h2></div>`; }
function emptyMsg(t){ return `<div class="empty">${t}</div>`; }
function searchBar(){ return `<div class="searchbar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="searchInput" placeholder="Search your saved websites..."></div>`; }
function goCategory(id){ view.page='categories'; view.catId=id; view.query=''; render(); }

// ---- Add / Edit site modal ----
function populateCatSelect(selectedId){
  const sel = document.getElementById('f_cat');
  sel.innerHTML = data.cats.map(c=>`<option value="${c.id}">${c.icon} ${escapeHtml(c.name)}</option>`).join('')
    + (ownerUnlocked ? `<option value="__new__">+ Add new domain / category</option>` : '');
  if(selectedId) sel.value = selectedId;
}
document.getElementById('f_cat').addEventListener('change', (e)=>{
  if(e.target.value === '__new__'){
    if(!ownerUnlocked){ e.target.value = data.cats[0]?.id || ''; return; }
    pendingCatReturn = true;
    openCatModal();
  }
});
function openSiteModal(id){
  editingId = id || null;
  populateCatSelect();
  document.getElementById('modalTitle').textContent = id ? 'Edit website' : 'Add a website';
  document.getElementById('saveBtn').textContent = id ? 'Save changes' : 'Save website';
  if(id){
    const s = data.sites.find(x=>x.id===id);
    document.getElementById('f_name').value = s.name;
    document.getElementById('f_url').value = s.url;
    document.getElementById('f_desc').value = s.desc||'';
    document.getElementById('f_cat').value = s.cat;
    document.getElementById('f_sub').value = s.sub||'';
    document.getElementById('f_tags').value = (s.tags||[]).join(', ');
    document.getElementById('f_fav').checked = !!s.fav;
  } else {
    document.getElementById('siteForm').reset();
  }
  document.getElementById('addOverlay').classList.add('show');
}
document.getElementById('cancelBtn').onclick = ()=> document.getElementById('addOverlay').classList.remove('show');
document.getElementById('siteForm').onsubmit = (e)=>{
  e.preventDefault();
  const name = document.getElementById('f_name').value.trim();
  let url = document.getElementById('f_url').value.trim();
  if(url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
  try{ new URL(url); }catch(err){ alert('Please enter a valid URL.'); return; }
  const desc = document.getElementById('f_desc').value.trim();
  const cat = document.getElementById('f_cat').value;
  const sub = document.getElementById('f_sub').value.trim();
  const tags = document.getElementById('f_tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const fav = document.getElementById('f_fav').checked;

  if(editingId){
    const s = data.sites.find(x=>x.id===editingId);
    Object.assign(s,{name,url,desc,cat,sub,tags,fav});
  } else {
    data.sites.unshift({ id:'s'+Date.now(), name,url,desc,cat,sub,tags,fav, addedAt:Date.now(), lastOpened:null, visits:0 });
  }
  save();
  document.getElementById('addOverlay').classList.remove('show');
  render();
};

// ---- New category modal ----
let pendingCatReturn = false;
function openCatModal(){
  if(!ownerUnlocked){ ownerToggle(); if(!ownerUnlocked) return; }
  document.getElementById('nc_name').value=''; document.getElementById('nc_icon').value=''; document.getElementById('catOverlay').classList.add('show');
}
document.getElementById('catCancel').onclick = ()=>{
  document.getElementById('catOverlay').classList.remove('show');
  if(pendingCatReturn){ pendingCatReturn=false; populateCatSelect(); }
};
document.getElementById('catSave').onclick = ()=>{
  const name = document.getElementById('nc_name').value.trim();
  if(!name) return;
  const icon = document.getElementById('nc_icon').value.trim() || '🔗';
  const id = name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'cat'+Date.now();
  data.cats.push({id,name,icon});
  save();
  document.getElementById('catOverlay').classList.remove('show');
  if(pendingCatReturn){ pendingCatReturn=false; populateCatSelect(id); }
  render();
};

render();
</script>
</body>
</html>
